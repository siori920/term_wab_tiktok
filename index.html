<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタルサイネージ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
    <script>
        // Google Apps Script Web App URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbxbeXIUuTHzoKvso1WMYRbGqmnU_rBatg_aPN0ODhIOKOXio-jl5JhQbv3unZ4gu77n/exec';

        // MP4動画のリスト
        const videos = [
            'videos/video1.mp4',
            'videos/video3.mp4',
        ];
        let currentVideoIndex = 0;
        
        // 統計データの初期化
        let videoStats = {
            video0: { count: 0, videoName: 'video1.mp4' },
            video1: { count: 0, videoName: 'video3.mp4' }
        };
        
        // 統計をサーバーから読み込む
        async function loadStats() {
            try {
                // キャッシュ回避のためにタイムスタンプを付与
                const response = await fetch(`${API_URL}?t=${Date.now()}`);
                if (response.ok) {
                    videoStats = await response.json();
                    console.log('✅ サーバーから統計を読み込みました');
                } else {
                    console.log('⚠️ サーバーから統計を取得できませんでした。');
                }
            } catch (e) {
                console.log('⚠️ サーバー接続エラー。ローカルモードで動作します:', e);
            }
        }
        
        // 統計を保存(サーバーに送信)
        async function saveVideoPlay(videoIndex) {
            const videoKey = `video${videoIndex}`;
            const videoName = videoStats[videoKey] ? videoStats[videoKey].videoName : `video${videoIndex + 1}.mp4`;
            
            try {
                // 最も制限を受けにくい GET 方式に変更
                // URLにパラメータを付与
                const url = `${API_URL}?videoIndex=${encodeURIComponent(videoIndex)}&videoName=${encodeURIComponent(videoName)}&t=${Date.now()}`;
                
                await fetch(url, {
                    method: 'GET',
                    mode: 'no-cors' // ブラウザ制限を回避
                });
                
                console.log('💾 再生記録をサーバーに送信(GET):', videoName);
            } catch (e) {
                console.error('❌ サーバー送信エラー:', e);
            }
        }
        
        // 動画を再生する共通処理
        function playVideo(index) {
            const videoElement = document.getElementById("video-player");
            if (!videos[index]) return;

            currentVideoIndex = index;
            videoElement.src = videos[index];
            videoElement.load();
            videoElement.play().catch(e => console.log("再生ブロック回避:", e));
            
            // ローカル統計更新
            const videoKey = `video${index}`;
            if (videoStats[videoKey]) {
                videoStats[videoKey].count++;
            }
            
            // サーバーに送信
            saveVideoPlay(index);
            console.log('✅ 動画再生を記録中:', videos[index]);
        }

        // ランダムな動画を再生
        function showRandomVideo() {
            const randomIndex = Math.floor(Math.random() * videos.length);
            playVideo(randomIndex);
        }
        
        // 次の動画を再生
        function showNextVideo() {
            currentVideoIndex = (currentVideoIndex + 1) % videos.length;
            playVideo(currentVideoIndex);
        }
        
        // 統計を表示（デバッグ用）
        async function showStats() {
            try {
                const response = await fetch(`${API_URL}?t=${Date.now()}`);
                if (response.ok) {
                    videoStats = await response.json();
                }
            } catch (e) {
                console.error('❌ 統計取得エラー:', e);
            }

            console.clear();
            console.log('📊 動画再生統計');
            let totalPlays = 0;
            Object.keys(videoStats).forEach(key => {
                totalPlays += videoStats[key].count;
            });
            
            Object.keys(videoStats).forEach(key => {
                const stats = videoStats[key];
                const percent = totalPlays > 0 ? Math.round(stats.count / totalPlays * 100) : 0;
                console.log(`【${key}】 ${stats.videoName}: ${stats.count}回 (${percent}%)`);
            });
            console.log(`合計: ${totalPlays}回`);
            alert('コンソール(F12)を確認してください。');
        }
        
        window.showStats = showStats;
        
        window.onload = function() {
            loadStats(); // 初回読み込み
            showRandomVideo(); // 再生開始
            
            const videoElement = document.getElementById("video-player");
            videoElement.onended = showNextVideo;
            
            console.log('📝 サイネージ起動完了');
        };
    </script>
</head>
<body>
    <div class="container">
        <video id="video-player" controls muted autoplay></video>
    </div>
</body>
</html>
