<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタルサイネージ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
    <script>
        // MP4動画のリスト
        const videos = [
            'videos/video1.mp4',
            'videos/video3.mp4',
        ];
        let currentVideoIndex = 0;
        
        // 統計データ（ローカルのみ）
        let videoStats = {
            video0: { count: 0, videoName: 'video1.mp4' },
            video1: { count: 0, videoName: 'video3.mp4' }
        };
        
        // 動画を再生する共通処理
        function playVideo(index) {
            const videoElement = document.getElementById("video-player");
            if (!videos[index]) return;

            currentVideoIndex = index;
            videoElement.src = videos[index];
            videoElement.load();
            videoElement.play().catch(e => console.log("再生ブロック回避:", e));
            
            // ローカル統計更新
            const videoKey = `video${index}`;
            if (videoStats[videoKey]) {
                videoStats[videoKey].count++;
            }
            
            console.log('✅ 動画再生:', videos[index]);
        }

        // ランダムな動画を再生
        function showRandomVideo() {
            const randomIndex = Math.floor(Math.random() * videos.length);
            playVideo(randomIndex);
        }
        
        // 次の動画を再生
        function showNextVideo() {
            currentVideoIndex = (currentVideoIndex + 1) % videos.length;
            playVideo(currentVideoIndex);
        }
        
        // 統計を表示（デバッグ用）
        function showStats() {
            console.clear();
            console.log('📊 動画再生統計（ローカルのみ）');
            let totalPlays = 0;
            Object.keys(videoStats).forEach(key => {
                totalPlays += videoStats[key].count;
            });
            
            Object.keys(videoStats).forEach(key => {
                const stats = videoStats[key];
                const percent = totalPlays > 0 ? Math.round(stats.count / totalPlays * 100) : 0;
                console.log(`【${key}】 ${stats.videoName}: ${stats.count}回 (${percent}%)`);
            });
            console.log(`合計: ${totalPlays}回`);
            alert('コンソール(F12)を確認してください。');
        }
        
        window.showStats = showStats;
        
        window.onload = function() {
            showRandomVideo(); // 再生開始
            
            const videoElement = document.getElementById("video-player");
            videoElement.onended = showNextVideo;
            
            console.log('📝 サイネージ起動完了');
        };
    </script>
</head>
<body>
    <div class="container">
        <video id="video-player" controls muted autoplay></video>
    </div>
</body>
</html>
